<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transfer - TRC-20</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { 
            --blue-primary: #1E4DFF; 
            --btn-purple: #9DA3FF; 
            --bg-pill: #F4F4F6; 
            --text-label: #646464; 
            --border-light: #EFEFEF;
            --tron-orange: #FF060A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; background-color: #fff; display: flex; flex-direction: column; overflow: hidden; }
        .content { flex: 1; padding: 10px 20px; overflow-y: auto; }
        .section { margin-top: 15px; }
        .label { font-size: 14.5px; color: var(--text-label); font-weight: 600; margin-bottom: 10px; display: block; }
        .input-group { display: flex; align-items: center; border: 1.8px solid var(--border-light); border-radius: 14px; height: 58px; padding: 0 16px; transition: 0.2s; position: relative; }
        .input-group.active { border-color: var(--blue-primary); border-width: 2px; }
        .input-group input { flex: 1; border: none; outline: none; font-size: 16px; font-weight: 500; color: #000; background: transparent; width: 100%; }
        #recipientInput { text-align: right; padding-right: 8px; }
        #amountInput { text-align: left; }
        .actions { display: flex; align-items: center; gap: 12px; }
        .blue-text { color: var(--blue-primary); font-weight: 700; font-size: 15px; cursor: pointer; }
        .clear-btn { width: 22px; height: 22px; background: #5F6368; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; margin-right: 5px; }
        .clear-btn::after { content: '×'; color: #FFFFFF; font-size: 18px; font-weight: 600; margin-top: -2px; }
        .icon-svg { width: 22px; height: 22px; fill: none; stroke: var(--blue-primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .network-pill { display: inline-flex; align-items: center; background-color: var(--bg-pill); padding: 6px 12px; border-radius: 20px; gap: 8px; }
        .tron-logo-image { width: 20px; height: 20px; object-fit: contain; }
        .network-text { font-size: 14px; color: #555; font-weight: 600; }
        .footer { padding: 20px; }
        .next-btn { width: 100%; height: 56px; background-color: var(--btn-purple); color: #fff; border: none; border-radius: 30px; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .next-btn.enabled { background-color: var(--blue-primary); }
        .approx-txt { font-size: 13px; color: #9FA3A9; margin-top: 10px; font-weight: 500; }
        
        /* Status Indicator */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 9999;
        }
        .status-bar.active {
            background: linear-gradient(90deg, var(--tron-orange), var(--blue-primary));
            animation: slide 2s infinite ease-in-out;
        }
        @keyframes slide {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }
    </style>
</head>
<body>

    <div class="status-bar" id="statusBar"></div>

    <div class="content">
        <div class="section" style="margin-top: 20px;">
            <label class="label">Address or Domain Name</label>
            <div class="input-group" id="addrGroup">
                <input type="text" id="recipientInput" value="TWd2zR4V1dFvJbXJZv3zQy4Xz5Zy6Zy7Z8" placeholder="Enter address">
                <div class="actions">
                    <div class="clear-btn" id="clearAddr" style="display: flex;"></div>
                    <span class="blue-text" id="pasteBtn">Paste</span>
                    <svg class="icon-svg" id="scanBtn" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2" /><line x1="3" y1="8" x2="6" y2="8" /><line x1="3" y1="12" x2="6" y2="12" /><line x1="3" y1="16" x2="6" y2="16" /></svg>
                    <svg class="icon-svg" id="addressBookBtn" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1-1h-3M8 20H5a1 1 0 0 1-1-1v-3" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
                </div>
            </div>
        </div>

        <div class="section">
            <label class="label">Destination network</label>
            <div class="network-pill" id="networkPill" style="cursor: pointer;">
                <svg class="tron-logo-image" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L22 7L22 17L12 22L2 17L2 7L12 2Z" fill="#FF060A"/>
                    <path d="M12 6L17 8.5V13.5L12 16L7 13.5V8.5L12 6Z" fill="white"/>
                </svg>
                <span class="network-text">Tron (TRC-20)</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9FA3A9" stroke-width="4"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>

        <div class="section">
            <label class="label">Amount</label>
            <div class="input-group" id="amountGroup">
                <input type="number" id="amountInput" placeholder="0" inputmode="decimal">
                <div class="actions">
                    <div class="clear-btn" id="clearAmount"></div>
                    <span style="color: #616469; font-size: 14px; font-weight: 500;">USDT</span>
                    <span class="blue-text" id="maxBtn">Max</span>
                </div>
            </div>
            <div class="approx-txt">≈ $<span id="usdLabel">0.00</span></div>
        </div>
    </div>

    <div class="footer">
        <button class="next-btn" id="nextBtn" disabled>Next</button>
    </div>

    <script type="module">
        // ── Interactive UI (All buttons fixed) ──
        
        // 1. DOM elements
        const recipientInput = document.getElementById('recipientInput');
        const amountInput = document.getElementById('amountInput');
        const addrGroup = document.getElementById('addrGroup');
        const amountGroup = document.getElementById('amountGroup');
        const clearAddr = document.getElementById('clearAddr');
        const clearAmount = document.getElementById('clearAmount');
        const pasteBtn = document.getElementById('pasteBtn');
        const maxBtn = document.getElementById('maxBtn');
        const nextBtn = document.getElementById('nextBtn');
        const usdLabel = document.getElementById('usdLabel');
        const statusBar = document.getElementById('statusBar');
        const scanBtn = document.getElementById('scanBtn');
        const addressBookBtn = document.getElementById('addressBookBtn');
        const networkPill = document.getElementById('networkPill');

        // 2. Toggle clear buttons visibility based on input
        function updateClearButtons() {
            clearAddr.style.display = recipientInput.value.trim().length > 0 ? 'flex' : 'none';
            clearAmount.style.display = amountInput.value.trim().length > 0 ? 'flex' : 'none';
        }

        // 3. Update Next button state
        function updateNextButton() {
            const addr = recipientInput.value.trim();
            const amount = amountInput.value.trim();
            const isValid = addr.length > 0 && amount.length > 0 && parseFloat(amount) > 0;
            if (isValid) {
                nextBtn.classList.add('enabled');
                nextBtn.disabled = false;
            } else {
                nextBtn.classList.remove('enabled');
                nextBtn.disabled = true;
            }
        }

        // 4. Update USD label (simulated rate: 1 USDT = 1 USD)
        function updateUsdLabel() {
            const amount = parseFloat(amountInput.value) || 0;
            usdLabel.textContent = amount.toFixed(2);
        }

        // 5. Clear address
        clearAddr.addEventListener('click', () => {
            recipientInput.value = '';
            updateClearButtons();
            updateNextButton();
            recipientInput.focus();
        });

        // 6. Clear amount
        clearAmount.addEventListener('click', () => {
            amountInput.value = '';
            updateClearButtons();
            updateNextButton();
            updateUsdLabel();
            amountInput.focus();
        });

        // 7. Paste button
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                recipientInput.value = text;
                updateClearButtons();
                updateNextButton();
            } catch (err) {
                // Fallback: prompt user
                const text = prompt('Paste address here:');
                if (text) {
                    recipientInput.value = text;
                    updateClearButtons();
                    updateNextButton();
                }
            }
        });

        // 8. Max button – simulate max balance (e.g., 1000 USDT)
        maxBtn.addEventListener('click', () => {
            amountInput.value = '1000';
            updateClearButtons();
            updateNextButton();
            updateUsdLabel();
        });

        // 9. Scan button (simulated – shows an alert)
        scanBtn.addEventListener('click', () => {
            alert('QR scanner would open here.');
        });

        // 10. Address book button (simulated – shows an alert)
        addressBookBtn.addEventListener('click', () => {
            alert('Address book would open here.');
        });

        // 11. Network pill (simulated – shows network options)
        networkPill.addEventListener('click', () => {
            alert('Network selection: Tron (TRC-20) is currently selected.');
        });

        // 12. Input focus/blur styling
        recipientInput.addEventListener('focus', () => addrGroup.classList.add('active'));
        recipientInput.addEventListener('blur', () => addrGroup.classList.remove('active'));
        amountInput.addEventListener('focus', () => amountGroup.classList.add('active'));
        amountInput.addEventListener('blur', () => amountGroup.classList.remove('active'));

        // 13. Input events for clearing/next/usd
        recipientInput.addEventListener('input', () => {
            updateClearButtons();
            updateNextButton();
        });
        amountInput.addEventListener('input', () => {
            updateClearButtons();
            updateNextButton();
            updateUsdLabel();
        });

        // 14. Next button action (simulated)
        nextBtn.addEventListener('click', () => {
            if (nextBtn.disabled) return;
            statusBar.classList.add('active');
            setTimeout(() => statusBar.classList.remove('active'), 2000);
            alert(`Transfer initiated:\nTo: ${recipientInput.value}\nAmount: ${amountInput.value} USDT\nNetwork: Tron (TRC-20)`);
        });

        // 15. Initial state
        updateClearButtons();
        updateNextButton();
        updateUsdLabel();

        // 16. Optional: prevent form submission on Enter
        recipientInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') e.preventDefault();
        });
        amountInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') e.preventDefault();
        });

        // 17. Simulated "Max" using a mocked balance (for demo)
        // In a real app you would fetch the balance, but here we keep it simple.
        // We'll also make the Max button fill a reasonable amount.
        // (Already set to 1000 above, but if you want to fetch real balance, replace this block.)

        console.log('UI ready — all buttons are interactive.');
    </script>
</body>
</html>
